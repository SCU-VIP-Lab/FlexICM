# C-TAIC eval. Codec checkpoints are derived from quality_level:
#   extension: ./checkpoints/ctaic/s2_sem_panoptic/stage2/{quality_level}/checkpoint_best_loss.pth.tar
#   base TAIC: ./checkpoints/taic/semantic/{quality_level}/checkpoint_best_loss.pth.tar
scenario: "s2"
dataset_path: "/home/zbellay/hdd2/Tianma/dataset/coco2017"
split: "val2017"
ann_file: "annotations/panoptic_val2017.json"
quality_level: 1
lmbda: 0.0035
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"
panoptic_gt_folder: "/data/coco2017/annotations/panoptic_val2017"
gpu_id: 0
cuda: true
test_batch_size: 1
num_workers: 4
pretrained_backbone: true

align_to_task: true

# Official task-network teacher (backbone/neck) for feature alignment D
# Panoptic extension: Mask2Former + Swin-L (F1=192)
use_official_teacher: true
task_config: "./checkpoints/task_networks/panoptic/mask2former_swin-l-p4-w12-384-in21k_16xb1-lsj-100e_coco-panoptic.py"
task_checkpoint: "./checkpoints/task_networks/panoptic/mask2former_swin-l-p4-w12-384-in21k_16xb1-lsj-100e_coco-panoptic_20220407_104949-82f8d28d.pth"
