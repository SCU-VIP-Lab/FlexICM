# C-TAIC eval. Codec checkpoints are derived from quality_level:
#   extension: ./checkpoints/ctaic/s1_det_instance/stage2/{quality_level}/checkpoint_best_loss.pth.tar
#   base TAIC: ./checkpoints/taic/detection/{quality_level}/checkpoint_best_loss.pth.tar
scenario: "s1"
dataset_path: "/home/zbellay/hdd2/Tianma/dataset/coco2017"
split: "val2017"
ann_file: "annotations/instances_val2017.json"
quality_level: 1
lmbda: 0.0035
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"
gpu_id: 0
cuda: true
test_batch_size: 1
num_workers: 4
pretrained_backbone: true

align_to_task: true

# Official task-network teacher (backbone/neck) for feature alignment D
use_official_teacher: true
task_config: "./configs/task_networks/cascade_mask_rcnn_swin_base_coco.py"
task_checkpoint: "./checkpoints/task_networks/instance/model_mmdet3.pth"
