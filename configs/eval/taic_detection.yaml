# TAIC eval: codec test + optional --with-metrics
task: "detection"
dataset_path: "/data/Dataset/coco2017"
split: "val2017"
ann_file: "annotations/instances_val2017.json"
quality_level: 1
lmbda: 0.0035
checkpoint: "./logs/taic_detection/1/checkpoint_0.1040.pth.tar"
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"
# official task network (required for --with-metrics)
gpu_id: 0
cuda: true
test_batch_size: 1
num_workers: 4
pretrained_backbone: true

# Official task-network teacher (backbone/neck) for feature alignment D
use_official_teacher: true
task_config: "./configs/task_networks/cascade_mask_rcnn_swin_base_coco.py"
task_checkpoint: "./checkpoints/task_networks/detection/model_mmdet3.pth"
