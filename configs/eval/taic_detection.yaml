# TAIC eval: codec test + optional --with-metrics
# Checkpoint path is derived from quality_level:
#   ./checkpoints/taic/{task}/{quality_level}/checkpoint_best_loss.pth.tar
task: "detection"
dataset_path: "/home/zbellay/hdd2/Tianma/dataset/coco2017"
split: "val2017"
ann_file: "annotations/instances_val2017.json"
quality_level: 4
lmbda: 0.0035
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"
# Task-aligned keep-ratio geom (see align_to_task). Legacy square: eval_size: 256
# eval_size: null
# official task network (required for --with-metrics)
gpu_id: 1
cuda: true
test_batch_size: 1
num_workers: 4
pretrained_backbone: true

# align with Cascade Mask R-CNN test: short 800 / long ≤1333
align_to_task: true
# short_edge: 800
# max_long_side: 1333

# Official task-network teacher (backbone/neck) for feature alignment D
use_official_teacher: true
task_config: "./configs/task_networks/cascade_mask_rcnn_swin_base_coco.py"
task_checkpoint: "./checkpoints/task_networks/detection/model_mmdet3.pth"
