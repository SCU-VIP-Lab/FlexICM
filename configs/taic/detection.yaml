# FlexICM TAIC - Object Detection (Cascade Mask R-CNN + Swin-B)
root: "logs"
exp_name: "taic_detection"
task: "detection"
dataset_path: "/home/zbellay/hdd2/Tianma/dataset/coco2017"
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"  # quality matches lmbda mapping
checkpoint:  null #"/home/zbellay/hdd2/Tianma/FlexICM/logs/taic_detection/3/checkpoint_best_loss.pth.tar"
freeze_base_codec: false  # false = fine-tune the entire TIC + SFMA + Task Connector
epochs: 6
learning_rate: 3.0e-5
gpu_id: 0
quality_level: 4
# paper lambda set: {0.0035, 0.0067, 0.0130, 0.0250, 0.2050}
lmbda: 0.3000
num_workers: 3
batch_size: 3
test_batch_size: 1
patch_size: 512  # short edge; alias of short_edge
max_long_side: 640  # MMDet keep-ratio cap
# batch_size may need lowering vs 256-crop training
cuda: true
save: true
seed: 42
pretrained_backbone: true
out_channels: 128
align_mode: "fpn"

# Official task-network teacher (backbone/neck) for feature alignment D
use_official_teacher: true
task_config: "./configs/task_networks/cascade_mask_rcnn_swin_base_coco.py"
task_checkpoint: "./checkpoints/task_networks/detection/model_mmdet3.pth"
