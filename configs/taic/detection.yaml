# FlexICM TAIC - Object Detection (Faster R-CNN + Swin-B)
root: "logs"
exp_name: "taic_detection"
task: "detection"
dataset_path: "/data/coco2017"
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"  # quality matches lmbda mapping
checkpoint: null
epochs: 35
learning_rate: 1.0e-4
gpu_id: 0
quality_level: 1
# paper lambda set: {0.0035, 0.0067, 0.0130, 0.0250}
lmbda: 0.0035
num_workers: 8
batch_size: 80
test_batch_size: 1
patch_size: 256
cuda: true
save: true
seed: 42
pretrained_backbone: true
out_channels: 128
align_mode: "fpn"
