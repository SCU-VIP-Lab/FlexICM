# Scenario s2: Semantic Segmentation (base) + Panoptic Segmentation (extension)
root: "logs"
exp_name: "ctaic_s2"
scenario: "s2"
dataset_path: "/media/tianma/datasets/coco2017"
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"
base_taic_checkpoint: "./checkpoints/taic/semantic/1/checkpoint_best_loss.pth.tar"
taic_init: "./checkpoints/taic/panoptic/1/checkpoint_best_loss.pth.tar"
stage1_checkpoint: "./checkpoints/ctaic/s2_sem_panoptic/stage1/1/checkpoint_best_loss.pth.tar"
epochs: 40
learning_rate: 1.0e-4
gpu_id: 0
quality_level: 1
lmbda: 0.0035
num_workers: 8
batch_size: 2
test_batch_size: 1
patch_size: 800
max_long_side: 1333
cuda: true
save: true
seed: 42
pretrained_backbone: true
# extension = panoptic Mask2Former Swin-L (F1=192); base semantic stays 128
out_channels: 192
align_mode: "stages"

# Official task-network teacher (backbone/neck) for feature alignment D
use_official_teacher: true
task_config: "./checkpoints/task_networks/panoptic/mask2former_swin-l-p4-w12-384-in21k_16xb1-lsj-100e_coco-panoptic.py"
task_checkpoint: "./checkpoints/task_networks/panoptic/mask2former_swin-l-p4-w12-384-in21k_16xb1-lsj-100e_coco-panoptic_20220407_104949-82f8d28d.pth"
