# Scenario s1: Object Detection (base) + Instance Segmentation (extension)
root: "logs"
exp_name: "ctaic_s1"
scenario: "s1"
dataset_path: "/media/tianma/datasets/coco2017"
base_codec: "./checkpoints/base_codec/base_codec_1.pth.tar"
# trained base-layer TAIC for detection (provides y_b_hat)
base_taic_checkpoint: "./checkpoints/taic/detection/1/checkpoint_best_loss.pth.tar"
# optional TAIC init for extension task
taic_init: "./checkpoints/taic/instance/1/checkpoint_best_loss.pth.tar"
stage1_checkpoint: "./checkpoints/ctaic/s1_det_instance/stage1/1/checkpoint_best_loss.pth.tar"
epochs: 40
learning_rate: 1.0e-4
gpu_id: 0
quality_level: 1
lmbda: 0.0035
num_workers: 8
batch_size: 2
test_batch_size: 1
patch_size: 800
max_long_side: 1333
cuda: true
save: true
seed: 42
pretrained_backbone: true
out_channels: 128  # extension = Cascade Mask R-CNN + Swin-B
align_mode: "fpn"

# Official task-network teacher (backbone/neck) for feature alignment D
use_official_teacher: true
task_config: "./configs/task_networks/cascade_mask_rcnn_swin_base_coco.py"
task_checkpoint: "./checkpoints/task_networks/instance/model_mmdet3.pth"
